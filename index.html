<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Truck Schedule | Alturas Capital Partners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#000;
      --surface:#080810;
      --card:#0d0d1a;
      --accent:#2a5298;
      --accent-light:#4a7fd4;
      --accent2:#e84545;
      --accent3:#3ecf8e;
      --text:#e8eaf0;
      --muted:#7f8798;
      --border:#1d1d31;
      --radius:12px;
    }

    body.light-mode {
      --bg:#fff;
      --surface:#f5f5f5;
      --card:#fff;
      --accent:#1e3a8a;
      --accent-light:#3b82f6;
      --accent2:#dc2626;
      --accent3:#059669;
      --text:#1f2937;
      --muted:#6b7280;
      --border:#e5e7eb;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      background:var(--bg);
      color:var(--text);
      font-family:'DM Sans',sans-serif;
      min-height:100vh;
      overflow-x:hidden;
      transition:background-color .3s,color .3s;
    }
    button { font:inherit; }
    body::before {
      content:'';
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:999;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.04'/%3E%3C/svg%3E");
      opacity:.35;
    }

    header {
      background:var(--surface);
      border-bottom:2px solid var(--border);
      padding:0 28px;
      position:sticky;
      top:0;
      z-index:200;
      display:flex;
      align-items:center;
      justify-content:space-between;
      min-height:68px;
      gap:16px;
    }
    .logo { display:flex; align-items:center; gap:14px; text-decoration:none; min-width:0; }
    .logo-badge { width:44px; height:44px; flex-shrink:0; }
    .logo-badge img { width:100%; height:100%; object-fit:contain; }
    body.light-mode .logo-badge img { filter:brightness(0); }
    .logo-main { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:3px; color:var(--text); line-height:1; }
    .logo-sub { font-size:9px; color:var(--muted); letter-spacing:3px; text-transform:uppercase; margin-top:3px; }
    .header-right { display:flex; align-items:center; gap:10px; }
    .last-updated { font-size:10px; color:var(--muted); letter-spacing:1px; white-space:nowrap; }
    .theme-toggle,.refresh-btn {
      padding:8px 12px;
      border-radius:6px;
      cursor:pointer;
      border:1px solid var(--border);
      background:transparent;
      color:var(--text);
      transition:.2s;
    }
    .refresh-btn { padding-inline:18px; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:1px; text-transform:uppercase; }
    .theme-toggle:hover,.refresh-btn:hover { color:var(--accent-light); border-color:var(--accent); }
    .refresh-btn:disabled { opacity:.55; cursor:not-allowed; }

    .maintenance-screen {
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      background:radial-gradient(circle at 50% 20%,#17284d 0,#0d0d1a 42%,#000 100%);
      text-align:center;
      color:#fff;
    }
    .maintenance-card {
      width:min(680px,100%);
      padding:52px 36px;
      border:1px solid rgba(74,127,212,.35);
      border-radius:18px;
      background:rgba(13,13,26,.86);
      box-shadow:0 28px 80px rgba(0,0,0,.45);
    }
    .maintenance-logo { width:72px; height:72px; object-fit:contain; margin-bottom:23px; }
    .maintenance-icon { font-size:46px; margin-bottom:12px; }
    .maintenance-title { font-family:'Bebas Neue',sans-serif; font-size:clamp(42px,8vw,68px); letter-spacing:4px; color:#4a7fd4; }
    .maintenance-copy { max-width:520px; margin:12px auto 0; color:#cbd5e1; font-size:16px; line-height:1.65; }
    .maintenance-note { margin-top:22px; color:#8791a5; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; }

    .hero {
      background:linear-gradient(135deg,var(--bg),var(--card),var(--bg));
      padding:48px 28px 40px;
      position:relative;
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:32px;
      align-items:center;
    }
    .hero::after { content:'🚚'; font-size:200px; position:absolute; right:-20px; bottom:-40px; opacity:.04; transform:scaleX(-1); pointer-events:none; }
    .hero-eyebrow { font-size:10px; letter-spacing:4px; text-transform:uppercase; color:var(--accent-light); margin-bottom:14px; }
    .hero-rule { width:36px; height:2px; background:var(--accent); margin-bottom:18px; }
    .hero h1 { font-family:'Bebas Neue',sans-serif; font-size:clamp(40px,6vw,72px); letter-spacing:4px; line-height:1; }
    .hero h1 span { color:var(--accent-light); }
    .hero-sub { color:var(--muted); margin-top:12px; font-size:13px; max-width:430px; line-height:1.6; }
    .hero-stats { display:flex; gap:32px; margin-top:32px; flex-wrap:wrap; }
    .hstat { border-left:2px solid var(--border); padding-left:16px; }
    .hstat-num { font-family:'Bebas Neue',sans-serif; font-size:32px; color:var(--accent-light); line-height:1; }
    .hstat-lbl { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-top:2px; }

    .today-panel { background:rgba(42,82,152,.08); border:1px solid rgba(42,82,152,.3); border-radius:var(--radius); padding:24px 28px; position:relative; z-index:1; min-height:220px; display:flex; flex-direction:column; }
    .today-panel-head { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .today-dot { width:10px; height:10px; border-radius:50%; background:var(--accent3); animation:pulse 2s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(62,207,142,.65)} 50%{box-shadow:0 0 0 7px rgba(62,207,142,0)} }
    .today-label { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--accent3); font-weight:700; }
    .today-date { font-size:11px; color:var(--muted); margin-left:auto; letter-spacing:1px; }
    .today-trucks { display:flex; flex-direction:column; gap:12px; flex:1; }
    .today-truck-item { display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:8px; background:rgba(42,82,152,.1); border:1px solid rgba(42,82,152,.2); cursor:pointer; transition:.2s; }
    .today-truck-item:hover { background:rgba(42,82,152,.15); border-color:rgba(42,82,152,.4); transform:translateX(4px); }
    .today-truck-icon { font-size:24px; }
    .today-truck-name { font-family:'Bebas Neue',sans-serif; font-size:19px; letter-spacing:1px; }
    .today-truck-meta { font-size:12px; color:var(--muted); margin-top:3px; }
    .today-truck-prop { font-size:11px; font-weight:600; margin-top:2px; text-transform:uppercase; letter-spacing:1px; }
    .today-empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted); text-align:center; gap:8px; }
    .today-empty-icon { font-size:32px; opacity:.25; }
    .today-empty-txt { font-size:12px; letter-spacing:1px; }

    .filter-section { background:var(--surface); border-bottom:1px solid var(--border); padding:20px 28px; display:flex; align-items:center; justify-content:center; gap:24px; flex-wrap:wrap; }
    .filter-group { position:relative; min-width:170px; }
    .filter-btn { width:100%; padding:10px 14px; border-radius:6px; background:var(--card); border:1px solid var(--border); color:var(--text); font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; cursor:pointer; display:flex; justify-content:space-between; }
    .filter-btn:hover { border-color:var(--accent); color:var(--accent-light); }
    .filter-dropdown { display:none; position:absolute; top:100%; left:0; right:0; background:var(--card); border:1px solid var(--border); border-radius:6px; margin-top:4px; z-index:300; max-height:300px; overflow-y:auto; box-shadow:0 4px 12px rgba(0,0,0,.3); }
    .filter-dropdown.open { display:block; }
    .filter-option { padding:12px 14px; cursor:pointer; font-size:11px; color:var(--text); border-bottom:1px solid var(--border); }
    .filter-option:hover { background:var(--surface); color:var(--accent-light); }
    .filter-option.selected { background:rgba(42,82,152,.2); color:var(--accent-light); font-weight:600; }

    .layout { display:grid; grid-template-columns:300px 1fr; }
    .sidebar { background:var(--surface); border-right:1px solid var(--border); position:sticky; top:68px; height:calc(100vh - 68px); overflow-y:auto; padding:24px 0; }
    .sb-section { padding:0 22px; margin-bottom:24px; }
    .sb-label { font-size:9px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:10px; }
    .sb-label::after { content:''; flex:1; height:1px; background:var(--border); }
    .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .cal-month { font-family:'Bebas Neue',sans-serif; font-size:26px; letter-spacing:2px; color:var(--accent-light); }
    .cal-nav-btn { background:transparent; border:1px solid var(--border); color:var(--text); width:32px; height:32px; border-radius:4px; cursor:pointer; font-size:16px; }
    .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
    .cal-day-label { text-align:center; font-size:10px; text-transform:uppercase; color:var(--muted); padding:4px 0 10px; }
    .cal-day { aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:6px; font-size:13px; cursor:pointer; position:relative; color:var(--muted); }
    .cal-day:hover:not(.empty) { background:var(--border); color:var(--text); }
    .cal-day.empty { pointer-events:none; }
    .cal-day.today { color:var(--accent-light); font-weight:700; background:rgba(42,82,152,.15); }
    .cal-day.has-event { color:var(--text); }
    .cal-day.has-event::after { content:''; position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent-light); }
    .cal-day.in-week { background:rgba(42,82,152,.07); }
    .cal-day.selected { background:var(--accent)!important; color:#fff!important; font-weight:700; }
    .legend { display:flex; flex-direction:column; gap:8px; }
    .legend-item { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); }
    .legend-dot { width:7px; height:7px; border-radius:50%; }
    .legend-count { margin-left:auto; color:var(--accent-light); font-weight:600; }
    .upcoming-items { display:flex; flex-direction:column; }
    .upcoming-item { display:flex; gap:10px; align-items:flex-start; padding:10px 22px; cursor:pointer; border-left:2px solid transparent; }
    .upcoming-item:hover { background:var(--card); border-left-color:var(--accent); }
    .upcoming-badge { border-radius:4px; padding:4px 8px; text-align:center; min-width:40px; }
    .uday { font-family:'Bebas Neue',sans-serif; font-size:22px; color:#fff; line-height:1; }
    .umon { font-size:8px; text-transform:uppercase; letter-spacing:1px; font-weight:700; color:rgba(255,255,255,.7); }
    .upcoming-name { font-size:12px; font-weight:600; color:var(--text); }
    .upcoming-prop { font-size:10px; color:var(--muted); margin-top:2px; }

    .content { min-width:0; padding:28px 32px 60px; }
    .content-main-title { font-family:'Bebas Neue',sans-serif; font-size:28px; letter-spacing:3px; margin-bottom:24px; }
    .section-head { display:flex; align-items:center; gap:12px; margin:32px 0 16px; flex-wrap:wrap; }
    .section-head:first-of-type { margin-top:0; }
    .section-badge { font-size:9px; letter-spacing:2px; text-transform:uppercase; font-weight:600; padding:4px 12px; border-radius:20px; }
    .badge-week { background:rgba(42,82,152,.2); color:var(--accent-light); border:1px solid rgba(42,82,152,.3); }
    .badge-future { background:rgba(58,175,100,.15); color:var(--accent3); border:1px solid rgba(58,175,100,.25); }
    .badge-past { background:rgba(90,96,112,.15); color:var(--muted); border:1px solid rgba(90,96,112,.2); }
    .section-title { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; }
    .section-count { font-size:11px; color:var(--muted); margin-left:auto; }
    .trucks-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
    .truck-card { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; transition:.25s; cursor:pointer; }
    .truck-card:hover { transform:translateY(-4px); border-color:var(--accent); box-shadow:0 12px 40px rgba(42,82,152,.18); }
    .truck-card.today-card { border-color:rgba(42,82,152,.55); box-shadow:0 0 24px rgba(42,82,152,.12); }
    .truck-card.past-card { opacity:.65; }
    .truck-card.past-card:hover { opacity:1; }
    .menu-img-wrap { aspect-ratio:3/4; background:var(--border); overflow:hidden; position:relative; }
    .menu-img-wrap img { width:100%; height:100%; object-fit:cover; display:block; transition:.35s; }
    .truck-card:hover .menu-img-wrap img { transform:scale(1.05); }
    .menu-placeholder { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:linear-gradient(135deg,var(--surface),var(--border)); color:var(--muted); }
    .ph-icon { font-size:40px; opacity:.25; }
    .ph-text { font-size:9px; text-transform:uppercase; letter-spacing:3px; }
    .zoom-hint { position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,.7); color:var(--accent-light); font-size:16px; width:30px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; opacity:0; transition:.2s; }
    .truck-card:hover .zoom-hint { opacity:1; }
    .prop-ribbon { position:absolute; top:10px; left:0; padding:3px 12px 3px 10px; font-size:9px; font-weight:700; letter-spacing:2px; text-transform:uppercase; background:rgba(0,0,0,.82); color:#fff; z-index:2; }
    .today-pill { position:absolute; top:10px; right:10px; background:var(--accent); color:#fff; font-size:8px; font-weight:700; letter-spacing:1px; text-transform:uppercase; padding:3px 8px; border-radius:20px; z-index:2; }
    .card-body { padding:14px 16px 16px; }
    .card-day-tag { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
    .card-name { font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:1px; line-height:1.1; margin-bottom:10px; }
    .card-divider { height:1px; background:var(--border); margin-bottom:10px; }
    .card-property { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; font-weight:600; }
    .card-date { font-size:12px; color:var(--accent-light); font-weight:600; }
    .card-time { font-size:11px; color:var(--muted); margin-top:3px; }
    .past-toggle { display:flex; align-items:center; gap:12px; cursor:pointer; padding:14px 18px; border-radius:10px; border:1px solid var(--border); background:var(--surface); width:100%; margin-top:32px; color:var(--text); }
    .past-arrow { margin-left:auto; color:var(--muted); transition:.25s; }
    .past-toggle.open .past-arrow { transform:rotate(180deg); }
    .past-content { display:none; margin-top:16px; }
    .past-content.open { display:block; }
    .empty-section { padding:36px 20px; text-align:center; color:var(--muted); border:1px dashed var(--border); border-radius:var(--radius); }
    .ei { font-size:30px; opacity:.2; margin-bottom:10px; }
    .loading-state { padding:60px; text-align:center; }
    .spinner { width:28px; height:28px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; margin:auto; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .error-banner { background:rgba(232,69,69,.08); border:1px solid rgba(232,69,69,.25); border-radius:8px; padding:14px 18px; margin-bottom:20px; font-size:13px; color:#f08080; display:none; line-height:1.6; }
    .error-banner.show { display:block; }

    .lightbox { position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,.95); display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(10px); }
    .lightbox.open { display:flex; }
    .lb-inner { position:relative; max-width:560px; width:100%; max-height:90vh; display:flex; flex-direction:column; }
    .lb-img-wrap { overflow-y:auto; border-radius:8px; border:1px solid #262638; max-height:70vh; }
    .lb-img-wrap img { width:100%; display:block; }
    .lb-no-img { padding:60px; text-align:center; color:#aaa; }
    .lb-pdf-btn { display:block; width:100%; padding:20px; background:linear-gradient(135deg,var(--accent),#1a4a6b); color:#fff; text-align:center; font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:2px; border-radius:8px; text-decoration:none; }
    .lb-close { position:absolute; top:-12px; right:-12px; background:var(--accent2); color:#fff; border:0; width:30px; height:30px; border-radius:50%; cursor:pointer; z-index:10; }
    .lb-info { margin-top:14px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; padding:0 14px; }
    .lb-name { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:2px; color:#fff; }
    .lb-prop { font-size:10px; color:#ccc; letter-spacing:2px; text-transform:uppercase; }
    .lb-date { text-align:right; font-size:12px; color:#ccc; font-weight:600; }
    .lb-actions { margin-top:12px; display:flex; gap:10px; padding:0 14px; }
    .lb-btn { flex:1; padding:10px 16px; border-radius:6px; font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; cursor:pointer; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); color:#fff; }

    footer { background:var(--surface); border-top:1px solid var(--border); padding:24px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .footer-copy,.footer-note { font-size:10px; color:var(--muted); letter-spacing:1px; }
    .footer-note a { color:var(--accent-light); }

    @media(max-width:900px) {
      .layout { grid-template-columns:1fr; }
      .sidebar { position:static; height:auto; border-right:0; border-bottom:1px solid var(--border); }
      .hero { grid-template-columns:1fr; }
      header,.hero,.filter-section,.content { padding-left:16px; padding-right:16px; }
    }
    @media(max-width:640px) {
      header { align-items:flex-start; padding-top:12px; padding-bottom:12px; }
      .logo-main { font-size:18px; letter-spacing:2px; }
      .logo-sub,.last-updated { display:none; }
      .header-right { margin-left:auto; }
      .refresh-btn { padding-inline:10px; }
      .filter-group { width:100%; }
      .today-date { display:none; }
      .section-count { width:100%; margin-left:0; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    /*
      MAINTENANCE SWITCH
      true  = show maintenance page
      false = show live food truck website
    */
    const MAINTENANCE_MODE = false;

    const CONFIG = {
      sheetId: '1u1g0pz_jI92Eifju4YeNTX6jkmk1MGmDJLsX6h40Bko',
      apiKey: 'PASTE_YOUR_NEW_RESTRICTED_GOOGLE_API_KEY_HERE',
      scheduleTab: 'Sheet1',
      cuisineTab: 'Sheet2',
      logoUrl: 'https://raw.githubusercontent.com/AlturasCOS/foodtruck-schedule/main/acp.png'
    };

    const PROPS = [
      { id:'Northcreek', color:'#2a5298' },
      { id:'985 Space Center', color:'#1a6b8a' },
      { id:'1055 Newport', color:'#2a6b4a' },
      { id:'Garden Gateway', color:'#4a3a7a' },
      { id:'Presidio', color:'#1a4a6b' }
    ];

    const app = document.getElementById('app');

    if (MAINTENANCE_MODE) {
      renderMaintenance();
    } else {
      renderApplicationShell();
      initialiseApplication();
    }

    function renderMaintenance() {
      document.title = 'Scheduled Maintenance | Alturas Capital Partners';
      app.innerHTML = `
        <main class="maintenance-screen">
          <section class="maintenance-card" aria-labelledby="maintenanceTitle">
            <img class="maintenance-logo" src="${CONFIG.logoUrl}" alt="Alturas Capital Partners logo">
            <div class="maintenance-icon" aria-hidden="true">🚧</div>
            <h1 class="maintenance-title" id="maintenanceTitle">Scheduled Maintenance</h1>
            <p class="maintenance-copy">
              The Alturas Capital Partners Food Truck Schedule is temporarily unavailable while updates are being completed.
            </p>
            <p class="maintenance-note">Please check back again soon</p>
          </section>
        </main>`;
    }

    function renderApplicationShell() {
      document.title = 'Food Truck Schedule | Alturas Capital Partners';
      app.innerHTML = `
        <header>
          <a class="logo" href="#" aria-label="Alturas Capital Partners home">
            <div class="logo-badge"><img src="${CONFIG.logoUrl}" alt="ACP"></div>
            <div><div class="logo-main">Alturas Capital Partners</div><div class="logo-sub">Colorado Springs, Colorado</div></div>
          </a>
          <div class="header-right">
            <span class="last-updated" id="lastUpdated"></span>
            <button class="theme-toggle" id="themeToggle" title="Toggle light or dark mode">☀️ / 🌙</button>
            <button class="refresh-btn" id="refreshButton">↻ Refresh</button>
          </div>
        </header>

        <section class="hero">
          <div>
            <div class="hero-eyebrow">Tenant Amenity Programme</div>
            <div class="hero-rule"></div>

              <div class="hstat"><div class="hstat-num" id="statVisits">–</div><div class="hstat-lbl">Upcoming Visits</div></div>
              <div class="hstat"><div class="hstat-num" id="statProps">–</div><div class="hstat-lbl">Properties</div></div>
              <div class="hstat"><div class="hstat-num" id="statTrucks">–</div><div class="hstat-lbl">Food Trucks</div></div>

          <div class="today-panel">

        <section class="filter-section" aria-label="Schedule filters">
          <div class="filter-group"><button class="filter-btn" data-dropdown="propDrop"><span id="propLabel">All Properties</span><span>▼</span></button><div class="filter-dropdown" id="propDrop"></div></div>
          <div class="filter-group"><button class="filter-btn" data-dropdown="cuisineDrop"><span id="cuisineLabel">All Cuisines</span><span>▼</span></button><div class="filter-dropdown" id="cuisineDrop"></div></div>
          <div class="filter-group"><button class="filter-btn" data-dropdown="truckDrop"><span id="truckLabel">All Food Trucks</span><span>▼</span></button><div class="filter-dropdown" id="truckDrop"></div></div>
        </section>

        <div class="layout">
          <aside class="sidebar">
            <div class="sb-section"><div class="sb-label">Calendar</div><div class="cal-head"><button class="cal-nav-btn" id="calPrev">‹</button><div class="cal-month" id="calLabel"></div><button class="cal-nav-btn" id="calNext">›</button></div><div class="cal-grid" id="calGrid"></div></div>
            <div class="sb-section"><div class="sb-label">Properties</div><div class="legend" id="legend"></div></div>
            <div class="sb-section"><div class="sb-label">Coming Up</div></div>
            <div class="upcoming-items" id="upcomingList"></div>
          </aside>
          <main class="content"><div class="error-banner" id="errorBanner"></div><div id="mainContent"><div class="loading-state"><div class="spinner"></div></div></div></main>
        </div>

        <footer><div class="footer-copy">© Alturas Capital Partners · Colorado Springs, Colorado</div><div class="footer-note">Want to suggest a food truck? Email us at <a href="mailto:admincos@alturas.com">admincos@alturas.com</a></div></footer>

        <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Food truck menu">
          <div class="lb-inner">
            <button class="lb-close" id="lbClose" aria-label="Close">×</button>
            <div class="lb-img-wrap" id="lbImgWrap"></div>
            <div class="lb-info"><div><div class="lb-name" id="lbName"></div><div class="lb-prop" id="lbProp"></div></div><div class="lb-date" id="lbDate"></div></div>
            <div class="lb-actions" id="lbActions"><button class="lb-btn" id="openMenuButton">↗ Open Menu</button></div>
          </div>
        </div>`;
    }

    let trucks = [];
    let cuisineMap = {};
    let filterProp = 'all';
    let filterCuisine = 'all';
    let filterTruck = 'all';
    let filterDate = null;
    let calYear;
    let calMonth;
    let currentMenuUrls = [];
    const now = startOfLocalDay(new Date());
    const todayStr = iso(now);
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];

    function initialiseApplication() {
      if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
      calYear = now.getFullYear();
      calMonth = now.getMonth();
      document.getElementById('todayDateLabel').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

      document.getElementById('themeToggle').addEventListener('click', toggleTheme);
      document.getElementById('refreshButton').addEventListener('click', loadData);
      document.getElementById('calPrev').addEventListener('click', () => calNav(-1));
      document.getElementById('calNext').addEventListener('click', () => calNav(1));
      document.getElementById('lbClose').addEventListener('click', closeLb);
      document.getElementById('openMenuButton').addEventListener('click', openMenuFull);
      document.getElementById('lightbox').addEventListener('click', event => { if (event.target.id === 'lightbox') closeLb(); });

      document.querySelectorAll('[data-dropdown]').forEach(button => {
        button.addEventListener('click', () => toggleDropdown(button.dataset.dropdown));
      });

      document.addEventListener('keydown', event => { if (event.key === 'Escape') closeLb(); });
      document.addEventListener('click', event => {
        if (!event.target.closest('.filter-group')) closeDropdowns();
      });

      loadData();
    }

    async function fetchSheet(tabName) {
      if (!CONFIG.apiKey || CONFIG.apiKey.includes('PASTE_YOUR')) throw new Error('Add your new restricted Google API key in CONFIG.apiKey.');
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${encodeURIComponent(CONFIG.sheetId)}/values/${encodeURIComponent(tabName)}?key=${encodeURIComponent(CONFIG.apiKey)}`;
      const response = await fetch(url);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error?.message || `Failed to load ${tabName}`);
      return data.values || [];
    }

    async function loadData() {
      const refreshButton = document.getElementById('refreshButton');
      try {
        refreshButton.disabled = true;
        refreshButton.textContent = 'Refreshing...';
        const [scheduleRows,cuisineRows] = await Promise.all([fetchSheet(CONFIG.scheduleTab),fetchSheet(CONFIG.cuisineTab)]);

        trucks = scheduleRows.slice(1).filter(row => row[0] && row[2]).map((row,index) => ({
          id:index + 1,
          name:String(row[0] || '').trim(),
          property:String(row[1] || '').trim(),
          date:parseDate(row[2]),
          time:String(row[3] || 'TBD').trim(),
          menu:String(row[4] || '').trim(),
          menus:row.slice(4,8).map(value => String(value || '').trim()).filter(Boolean)
        })).filter(truck => truck.date);

        cuisineMap = {};
        cuisineRows.slice(1).forEach(row => {
          if (row[0] && row[2]) cuisineMap[String(row[0]).trim()] = String(row[2]).trim();
        });

        document.getElementById('lastUpdated').textContent = `Updated ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}`;
        document.getElementById('errorBanner').classList.remove('show');
        updateStats();
        populateFilters();
        renderTodayPanel();
        renderCalendar();
        renderUpcoming();
        renderMain();
      } catch (error) {
        showLoadError(error);
      } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = '↻ Refresh';
      }
    }

    function showLoadError(error) {
      const banner = document.getElementById('errorBanner');
      banner.textContent = `Could not load schedule. ${error.message}`;
      banner.classList.add('show');
      document.getElementById('mainContent').innerHTML = '<div class="empty-section"><div class="ei">⚠️</div><div>Schedule unavailable</div></div>';
      document.getElementById('todayTrucks').innerHTML = '<div class="today-empty"><div class="today-empty-txt">Could not load</div></div>';
    }

    function populateFilters() {
      const propDrop = document.getElementById('propDrop');
      const cuisineDrop = document.getElementById('cuisineDrop');
      const truckDrop = document.getElementById('truckDrop');
      propDrop.replaceChildren();
      cuisineDrop.replaceChildren();
      truckDrop.replaceChildren();
      appendFilterOption(propDrop,'prop','all','All Properties');
      PROPS.forEach(property => appendFilterOption(propDrop,'prop',property.id,property.id));
      appendFilterOption(cuisineDrop,'cuisine','all','All Cuisines');
      [...new Set(trucks.map(truck => cuisineMap[truck.name]).filter(Boolean))].sort().forEach(cuisine => appendFilterOption(cuisineDrop,'cuisine',cuisine,cuisine));
      appendFilterOption(truckDrop,'truck','all','All Food Trucks');
      [...new Set(trucks.map(truck => truck.name))].sort().forEach(name => appendFilterOption(truckDrop,'truck',name,name));
    }

    function appendFilterOption(container,type,value,label) {
      const option = document.createElement('div');
      option.className = 'filter-option';
      option.dataset.value = value;
      option.textContent = label;
      option.classList.toggle('selected',getActiveFilter(type) === value);
      option.addEventListener('click',() => selectFilter(type,value,label));
      container.appendChild(option);
    }

    function getActiveFilter(type) {
      return type === 'prop' ? filterProp : type === 'cuisine' ? filterCuisine : filterTruck;
    }

    function selectFilter(type,value,label) {
      if (type === 'prop') { filterProp = value; document.getElementById('propLabel').textContent = label; }
      if (type === 'cuisine') { filterCuisine = value; document.getElementById('cuisineLabel').textContent = label; }
      if (type === 'truck') { filterTruck = value; document.getElementById('truckLabel').textContent = label; }
      populateFilters();
      closeDropdowns();
      renderTodayPanel();
      renderCalendar();
      renderUpcoming();
      renderMain();
    }

    function toggleDropdown(id) {
      const selected = document.getElementById(id);
      document.querySelectorAll('.filter-dropdown').forEach(dropdown => {
        if (dropdown !== selected) dropdown.classList.remove('open');
      });
      selected.classList.toggle('open');
    }

    function closeDropdowns() {
      document.querySelectorAll('.filter-dropdown').forEach(dropdown => dropdown.classList.remove('open'));
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      localStorage.setItem('theme',document.body.classList.contains('light-mode') ? 'light' : 'dark');
    }

    function startOfLocalDay(date) { const copy = new Date(date); copy.setHours(0,0,0,0); return copy; }
    function iso(date) { return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; }
    function isValidIsoDate(value) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
      if (!match) return false;
      const date = new Date(Number(match[1]),Number(match[2])-1,Number(match[3]));
      return date.getFullYear() === Number(match[1]) && date.getMonth() === Number(match[2])-1 && date.getDate() === Number(match[3]);
    }

    function parseDate(raw) {
      if (!raw) return null;
      const value = String(raw).trim();
      if (isValidIsoDate(value)) return value;
      const slash = /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/.exec(value);
      if (slash) {
        const year = slash[3].length === 2 ? `20${slash[3]}` : slash[3];
        const candidate = `${year}-${slash[1].padStart(2,'0')}-${slash[2].padStart(2,'0')}`;
        return isValidIsoDate(candidate) ? candidate : null;
      }
      if (/^\d+(\.\d+)?$/.test(value)) {
        const serial = Math.floor(Number(value));
        const date = new Date(Date.UTC(1899,11,30) + serial * 86400000);
        return `${date.getUTCFullYear()}-${String(date.getUTCMonth()+1).padStart(2,'0')}-${String(date.getUTCDate()).padStart(2,'0')}`;
      }
      const parsed = new Date(value);
      return Number.isNaN(parsed.getTime()) ? null : iso(parsed);
    }

    function safeHttpUrl(value) {
      if (!value) return '';
      try {
        const url = new URL(value,window.location.href);
        return ['http:','https:'].includes(url.protocol) ? url.href : '';
      } catch { return ''; }
    }

    function driveUrl(value) {
      if (!value) return '';
      const input = String(value).trim();
      if (!input.startsWith('http')) return safeHttpUrl(`https://raw.githubusercontent.com/AlturasCOS/foodtruck-schedule/main/menus/${input}`);
      if (!input.includes('drive.google.com')) {
        const converted = input.includes('admincos.github.io/foodtruck-schedule') ? input.replace('admincos.github.io/foodtruck-schedule','raw.githubusercontent.com/AlturasCOS/foodtruck-schedule/main') : input;
        return safeHttpUrl(converted);
      }
      const match = input.match(/\/d\/([a-zA-Z0-9_-]+)/) || input.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      return match ? safeHttpUrl(`https://drive.google.com/uc?export=view&id=${match[1]}`) : safeHttpUrl(input);
    }

    function isPdfUrl(value) {
      try { return new URL(value,window.location.href).pathname.toLowerCase().endsWith('.pdf'); }
      catch { return false; }
    }

    function getWeekBounds() {
      const day = now.getDay();
      const monday = new Date(now);
      monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1));
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      return { start:iso(monday),end:iso(sunday) };
    }

    function getPropColor(name) { return PROPS.find(property => property.id === name)?.color || '#2a5298'; }
    function matchFilters(truck) { return (filterProp === 'all' || truck.property === filterProp) && (filterCuisine === 'all' || cuisineMap[truck.name] === filterCuisine) && (filterTruck === 'all' || truck.name === filterTruck); }
    function fmtDate(value) { return new Date(`${value}T00:00:00`).toLocaleDateString('en-US',{weekday:'short',month:'long',day:'numeric',year:'numeric'}); }
    function fmtDay(value) { return new Date(`${value}T00:00:00`).toLocaleDateString('en-US',{weekday:'long'}); }

    function updateStats() {
      const upcoming = trucks.filter(truck => truck.date >= todayStr);
      document.getElementById('statVisits').textContent = upcoming.length;
      document.getElementById('statProps').textContent = new Set(upcoming.map(truck => truck.property).filter(Boolean)).size;
      document.getElementById('statTrucks').textContent = new Set(upcoming.map(truck => truck.name).filter(Boolean)).size;
    }

    function createTextElement(tag,className,text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text;
      return element;
    }

    function renderTodayPanel() {
      const container = document.getElementById('todayTrucks');
      container.replaceChildren();
      const list = trucks.filter(truck => truck.date === todayStr && matchFilters(truck));
      if (!list.length) {
        const empty = createTextElement('div','today-empty','');
        empty.append(createTextElement('div','today-empty-icon','🚚'),createTextElement('div','today-empty-txt','No food trucks on site today'));
        container.appendChild(empty);
        return;
      }
      list.forEach(truck => {
        const item = createTextElement('div','today-truck-item','');
        item.tabIndex = 0;
        item.appendChild(createTextElement('div','today-truck-icon','🚚'));
        const details = document.createElement('div');
        details.append(createTextElement('div','today-truck-name',`${truck.name} is on site today!`),createTextElement('div','today-truck-meta',truck.time));
        const property = createTextElement('div','today-truck-prop',truck.property);
        property.style.color = getPropColor(truck.property);
        details.appendChild(property);
        item.appendChild(details);
        item.addEventListener('click',() => openLb(truck.id));
        item.addEventListener('keydown',event => { if (event.key === 'Enter') openLb(truck.id); });
        container.appendChild(item);
      });
    }

    function renderCalendar() {
      document.getElementById('calLabel').textContent = `${MONTHS[calMonth]} ${calYear}`;
      const grid = document.getElementById('calGrid');
      grid.replaceChildren();
      DAYS.forEach(day => grid.appendChild(createTextElement('div','cal-day-label',day)));
      const {start,end} = getWeekBounds();
      const first = new Date(calYear,calMonth,1).getDay();
      const total = new Date(calYear,calMonth+1,0).getDate();
      for (let i=0;i<first;i++) grid.appendChild(createTextElement('div','cal-day empty',''));
      for (let day=1;day<=total;day++) {
        const date = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const hasEvents = trucks.some(truck => truck.date === date && matchFilters(truck));
        const cell = createTextElement('div','cal-day',String(day));
        if (date === todayStr) cell.classList.add('today');
        if (hasEvents) cell.classList.add('has-event');
        if (date >= start && date <= end) cell.classList.add('in-week');
        if (date === filterDate) cell.classList.add('selected');
        cell.addEventListener('click',() => selectDate(date));
        grid.appendChild(cell);
      }

      const legend = document.getElementById('legend');
      legend.replaceChildren();
      PROPS.forEach(property => {
        const item = createTextElement('div','legend-item','');
        const dot = createTextElement('div','legend-dot','');
        dot.style.background = property.color;
        item.append(dot,document.createTextNode(property.id),createTextElement('span','legend-count',String(trucks.filter(truck => truck.property === property.id && truck.date >= todayStr).length)));
        legend.appendChild(item);
      });
    }

    function calNav(direction) {
      calMonth += direction;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendar();
    }

    function selectDate(date) {
      filterDate = filterDate === date ? null : date;
      renderCalendar();
      renderMain();
      document.getElementById('mainContent').scrollIntoView({behaviour:'smooth',block:'start'});
    }

    function renderUpcoming() {
      const list = document.getElementById('upcomingList');
      list.replaceChildren();
      const items = trucks.filter(truck => truck.date >= todayStr && matchFilters(truck)).sort((a,b) => a.date.localeCompare(b.date)).slice(0,6);
      if (!items.length) { list.appendChild(createTextElement('div','upcoming-prop','No upcoming visits.')); return; }
      items.forEach(truck => {
        const date = new Date(`${truck.date}T00:00:00`);
        const item = createTextElement('div','upcoming-item','');
        const badge = createTextElement('div','upcoming-badge','');
        badge.style.background = getPropColor(truck.property);
        badge.append(createTextElement('div','uday',String(date.getDate())),createTextElement('div','umon',date.toLocaleString('default',{month:'short'})));
        const details = document.createElement('div');
        details.append(createTextElement('div','upcoming-name',truck.name),createTextElement('div','upcoming-prop',`${truck.property} · ${truck.time}`));
        item.append(badge,details);
        item.addEventListener('click',() => openLb(truck.id));
        list.appendChild(item);
      });
    }

    function renderMain() {
      const main = document.getElementById('mainContent');
      main.replaceChildren();
      const filtered = trucks.filter(matchFilters);
      const title = createTextElement('div','content-main-title',filterProp === 'all' ? 'All Visits' : filterProp);
      main.appendChild(title);

      if (filterDate) {
        const selected = filtered.filter(truck => truck.date === filterDate);
        const notice = createTextElement('div','error-banner show',`Showing visits for ${fmtDate(filterDate)}. Click the selected calendar date again to clear the filter.`);
        notice.style.color = 'var(--accent-light)';
        notice.style.background = 'rgba(42,82,152,.1)';
        main.appendChild(notice);
        appendSection(main,filterDate === todayStr ? 'Today' : filterDate < todayStr ? 'Past Visit' : 'Selected Date',fmtDate(filterDate),selected,filterDate < todayStr);
        return;
      }

      const {start,end} = getWeekBounds();
      const currentWeek = filtered.filter(truck => truck.date >= start && truck.date <= end).sort((a,b) => a.date.localeCompare(b.date));
      const future = filtered.filter(truck => truck.date > end).sort((a,b) => a.date.localeCompare(b.date));
      const past = filtered.filter(truck => truck.date < start).sort((a,b) => b.date.localeCompare(a.date));
      appendSection(main,'This Week',`${fmtDate(start)} to ${fmtDate(end)}`,currentWeek,false);
      appendSection(main,'Upcoming','Future Visits',future,false);

      const toggle = createTextElement('button','past-toggle','');
      toggle.append(createTextElement('span','section-badge badge-past','Past Visits'),createTextElement('span','section-title','Previous Food Truck Visits'),createTextElement('span','section-count',`${past.length} visit${past.length === 1 ? '' : 's'}`),createTextElement('span','past-arrow','▼'));
      const content = createTextElement('div','past-content','');
      const grid = createTextElement('div','trucks-grid','');
      past.forEach(truck => grid.appendChild(createTruckCard(truck,false,true)));
      content.appendChild(grid);
      toggle.addEventListener('click',() => { toggle.classList.toggle('open'); content.classList.toggle('open'); });
      main.append(toggle,content);
    }

    function appendSection(parent,badge,title,truckList,isPast) {
      const head = createTextElement('div','section-head','');
      const badgeElement = createTextElement('span',`section-badge ${isPast ? 'badge-past' : badge === 'Upcoming' ? 'badge-future' : 'badge-week'}`,badge);
      head.append(badgeElement,createTextElement('span','section-title',title),createTextElement('span','section-count',`${truckList.length} visit${truckList.length === 1 ? '' : 's'}`));
      parent.appendChild(head);
      if (!truckList.length) {
        const empty = createTextElement('div','empty-section','');
        empty.append(createTextElement('div','ei','🚚'),createTextElement('div','', 'No truck visits in this section'));
        parent.appendChild(empty);
        return;
      }
      const grid = createTextElement('div','trucks-grid','');
      truckList.forEach(truck => grid.appendChild(createTruckCard(truck,truck.date === todayStr,isPast)));
      parent.appendChild(grid);
    }

    function createTruckCard(truck,isToday,isPast) {
      const card = createTextElement('article',`truck-card${isToday ? ' today-card' : ''}${isPast ? ' past-card' : ''}`,'');
      card.tabIndex = 0;
      const imageWrap = createTextElement('div','menu-img-wrap','');
      const ribbon = createTextElement('div','prop-ribbon',truck.property);
      ribbon.style.color = getPropColor(truck.property);
      imageWrap.appendChild(ribbon);
      if (isToday) imageWrap.appendChild(createTextElement('div','today-pill','Today'));
      const source = driveUrl(truck.menus?.[0] || truck.menu);
      if (source && !isPdfUrl(source)) {
        const image = document.createElement('img');
        image.src = source;
        image.alt = `${truck.name} menu`;
        image.loading = 'lazy';
        image.addEventListener('error',() => image.replaceWith(createMenuPlaceholder('Image Unavailable')));
        imageWrap.appendChild(image);
      } else {
        imageWrap.appendChild(createMenuPlaceholder(source ? 'PDF Menu' : 'Menu Coming Soon'));
      }
      imageWrap.appendChild(createTextElement('div','zoom-hint','⊕'));

      const body = createTextElement('div','card-body','');
      const dayTag = createTextElement('div','card-day-tag',isToday ? 'ON SITE TODAY' : fmtDay(truck.date).toUpperCase());
      dayTag.style.color = isToday ? 'var(--accent-light)' : isPast ? 'var(--muted)' : 'var(--accent3)';
      body.append(dayTag,createTextElement('div','card-name',truck.name),createTextElement('div','card-divider',''),createTextElement('div','card-property',truck.property),createTextElement('div','card-date',fmtDate(truck.date)),createTextElement('div','card-time',truck.time));
      card.append(imageWrap,body);
      card.addEventListener('click',() => openLb(truck.id));
      card.addEventListener('keydown',event => { if (event.key === 'Enter') openLb(truck.id); });
      return card;
    }

    function createMenuPlaceholder(message) {
      const placeholder = createTextElement('div','menu-placeholder','');
      placeholder.append(createTextElement('div','ph-icon','🍽'),createTextElement('div','ph-text',message));
      return placeholder;
    }

    function openLb(id) {
      const truck = trucks.find(item => item.id === id);
      if (!truck) return;
      document.getElementById('lbName').textContent = truck.name;
      document.getElementById('lbProp').textContent = truck.property;
      document.getElementById('lbDate').textContent = `${fmtDate(truck.date)} · ${truck.time}`;
      const rawMenus = truck.menus?.length ? truck.menus : truck.menu ? [truck.menu] : [];
      currentMenuUrls = rawMenus.flatMap(value => value.split('|')).map(value => driveUrl(value.trim())).filter(Boolean);
      const wrap = document.getElementById('lbImgWrap');
      wrap.replaceChildren();
      const actions = document.getElementById('lbActions');

      if (!currentMenuUrls.length) {
        wrap.appendChild(createTextElement('div','lb-no-img','No menu image available yet.'));
        actions.style.display = 'none';
      } else if (isPdfUrl(currentMenuUrls[0])) {
        const link = createTextElement('a','lb-pdf-btn','📄 Open Full Menu (PDF)');
        link.href = currentMenuUrls[0];
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        wrap.appendChild(link);
        actions.style.display = 'none';
      } else {
        currentMenuUrls.forEach((url,index) => {
          const image = document.createElement('img');
          image.src = url;
          image.alt = `Menu page ${index + 1}`;
          if (index) image.style.marginTop = '10px';
          image.addEventListener('error',() => image.remove());
          wrap.appendChild(image);
        });
        actions.style.display = 'flex';
      }
      document.getElementById('lightbox').classList.add('open');
    }

    function openMenuFull() {
      currentMenuUrls.forEach(url => window.open(url,'_blank','noopener,noreferrer'));
    }

    function closeLb() {
      document.getElementById('lightbox')?.classList.remove('open');
      currentMenuUrls = [];
    }
  </script>
</body>
</html>
